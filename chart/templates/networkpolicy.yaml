{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "readout.fullname" . }}
  labels:
    {{- include "readout.labels" . | nindent 4 }}
  {{- $ann := include "readout.annotations" (dict "context" .) }}
  {{- with $ann }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  # Selects this chart's readout pods. An empty ingress/egress rule list under a
  # declared policyType is default-deny for that direction.
  podSelector:
    matchLabels:
      {{- include "readout.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  # Each ingress rule opens exactly ONE port to its own peer list, so a peer
  # named for one purpose never receives the other port: the ingress controller
  # reaches the app port only, a scraper reaches the metrics port only.
  ingress:
    {{- with $np.ingress.from }}
    # App port (config.port).
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ $.Values.config.port | default 8080 }}
    {{- end }}
    {{- if $.Values.metrics.enabled }}
    {{- with $np.ingress.metricsFrom }}
    # Metrics port (metrics.port).
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ $.Values.metrics.port }}
    {{- end }}
    {{- end }}
    {{- if (.Values.testFramework).enabled }}
    # The `helm test` pod (tests/test-connection.yaml) curls /readyz through the
    # Service. It carries instance + component but no app.kubernetes.io/name, so
    # it is outside this policy's podSelector; this rule admits it to the app
    # port from this namespace only (no namespaceSelector).
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: test-connection
      ports:
        - protocol: TCP
          port: {{ .Values.config.port | default 8080 }}
    {{- end }}
  egress:
    {{- if $np.egress.dns }}
    # DNS resolution (kube-dns / CoreDNS): readout must resolve the apiserver and
    # the OIDC issuer before it can reach them.
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- end }}
    {{- with $np.egress.to }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
