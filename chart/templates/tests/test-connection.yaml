{{- if (.Values.testFramework).enabled }}
# Opt-in connectivity smoke test for a deployed release. Runs only under
# `helm test`: the pod curls the in-cluster Service's /readyz and exits non-zero
# if it is not ready, which marks the test as failed. Off by default because it
# requires a reachable, running release.
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "readout.fullname.suffixed" (dict "context" . "suffix" "test-connection") }}"
  # readout.testLabels, not readout.labels: no app.kubernetes.io/name, so this
  # pod matches none of the chart's selectors (see _helpers.tpl).
  labels:
    {{- include "readout.testLabels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  # curl only ever talks to the release's own Service. It has no business with
  # the apiserver, so the namespace default account's token stays unmounted --
  # unlike the readout pod, whose deliberate `true` the Live mode needs.
  automountServiceAccountToken: false
  restartPolicy: Never
  containers:
    - name: test-connection
      image: "{{ if .Values.testFramework.image.digest }}{{ .Values.testFramework.image.repository }}@{{ .Values.testFramework.image.digest }}{{ else }}{{ .Values.testFramework.image.repository }}:{{ .Values.testFramework.image.tag }}{{ end }}"
      command: ["curl"]
      args:
        - "--fail"
        - "--silent"
        - "--show-error"
        - "http://{{ include "readout.fullname" . }}:{{ .Values.service.port }}/readyz"
{{- end }}
