      description: "Update the default readout image to v0.15.0, released in lockstep with the chart."
    - kind: fixed
      description: "readout v0.15.0: the list filter keeps its free text through a Refresh click, a Live reconnect or tab return and the periodic Live snapshot, focused or not, instead of emptying and bringing every row back. The text rides the page URL as `q`, so a reload and Back/Forward keep it too."
    - kind: added
      description: "readout v0.15.0: ⏎ on plain filter text pins it as a `name:` chip where the table has a Name column."
    - kind: changed
      description: "readout v0.15.0: Kubernetes client libraries 0.37.0 and routine dependency updates."
