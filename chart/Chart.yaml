apiVersion: v2
name: readout
description: Strictly read-only Kubernetes web viewer in Go
type: application
version: 0.14.0
appVersion: 0.13.0
kubeVersion: ">=1.25.0-0"
home: https://github.com/kbelokon/readout
sources:
  - https://github.com/kbelokon/readout
icon: https://raw.githubusercontent.com/kbelokon/readout/main/brand/readout-icon.png
keywords:
  - kubernetes
  - read-only
  - viewer
  - dashboard
  - rbac
  - oidc
maintainers:
  - name: Kirill Belokon
    email: kb@kbelokon.com
    url: https://github.com/kbelokon
annotations:
  artifacthub.io/license: GPL-3.0-only
  artifacthub.io/links: |
    - name: source
      url: https://github.com/kbelokon/readout
    - name: chart
      url: https://github.com/kbelokon/readout/tree/main/chart
  artifacthub.io/images: |
    - name: readout
      image: ghcr.io/kbelokon/readout:0.13.0
  artifacthub.io/changes: |
    - kind: fixed
      description: "Accept the two top-level keys a parent chart owns (`global`, and `enabled` for `condition: <name>.enabled`) so the chart can be used as a dependency of an umbrella chart. Every other unknown key stays rejected."
    - kind: added
      description: "New `imagePullSecrets` value, applied to both pods the chart renders: the readout Deployment and the `helm test` pod (which pulls a different image, from a different registry). Kubernetes-native shape -- a list of `{name: <secret>}`."
    - kind: security
      description: "The `helm test` pod no longer mounts the namespace default ServiceAccount's token. It curls the release's Service and never calls the apiserver, so the token was unnecessary. The readout pod's own automountServiceAccountToken is unchanged -- Live/in-cluster mode needs it."
    - kind: added
      description: "Document using the chart as a subchart, including that Helm does not print a subchart's NOTES unless you install with --render-subchart-notes -- this chart's safety warnings live there. Chart-only release: the application is unchanged at 0.13.0."
