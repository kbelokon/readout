# Local development toolchain. Keep this in sync with CI/Makefile pins.
[tools]
go = "1.27.0"
node = "24.19.0"
python = "3.13.15"
"github:go-gremlins/gremlins" = "0.6.0"
golangci-lint = "2.13.2"
make = "4.4.1"
zig = "0.16.0"
helm = "3.21.0"
kubeconform = "0.8.0"

[env]
# Repository-local Go-installed helper binaries (templ, govulncheck).
GOBIN = "{{ config_root }}/.mise/bin"
# Use the pinned Zig compiler for reproducible cgo and mutation runs. The Make
# race target substitutes Apple clang only on macOS for Go 1.27 linker support.
CGO_ENABLED = "1"
CC = "zig cc"

[env._]
path = ["{{ env.GOBIN }}"]

[tasks.setup]
description = "Install the full pinned development and mutation toolchain"
run = [
  "mise install",
  "go install github.com/a-h/templ/cmd/templ@v0.3.1020",
  "go install golang.org/x/vuln/cmd/govulncheck@v1.3.0",
]

[tasks.doctor]
description = "Print the local toolchain versions expected by this repository"
run = [
  "go version",
  "node --version",
  "npm --version",
  "python3 --version",
  "python3 tools/mutation/evaluate.py --verify-tool",
  "make --version | head -n 1",
  "zig version",
  "golangci-lint --version",
  "templ version",
  "govulncheck -version",
  "helm version --short",
  "kubeconform -v",
]

[tasks.mutation-go]
description = "Run the resumable, resource-bounded Go mutation campaign"
run = "make go-mutation"

[tasks.mutation-go-full]
description = "Recompute every Go mutant and publish a fresh full report"
run = "make go-mutation-full"

[tasks.mutation-go-check]
description = "Verify the latest fresh full Go mutation report"
run = "make go-mutation-check"

[tasks.mutation-go-sanity]
description = "Run the known-killed/lived/build-invalid Gremlins canary"
run = "make go-mutation-sanity"

[tasks.mutation-go-clean]
description = "Remove only the runner-owned Go mutation cache"
run = "make go-mutation-clean"
